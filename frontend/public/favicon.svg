<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e08b" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8524" />
      <stop offset="100%" stop-color="#e8c863" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="118" fill="url(#obsidianGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" />
  
  <!-- Subtle Architectural Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#d4af37" stroke-opacity="0.06" stroke-width="1" />

  <!-- ARQ Monogram Crest -->
  <g filter="url(#goldGlow)">
    <!-- Outer Chevron Apex / Arch -->
    <path d="M256 86 L92 410 H174 L256 226 L338 410 H420 Z" fill="url(#goldGrad)" />
    
    <!-- Central Barbell Horizontal Beam -->
    <rect x="156" y="302" width="200" height="24" rx="6" fill="#09090b" />
    <rect x="160" y="306" width="192" height="16" rx="4" fill="url(#goldGrad)" />

    <!-- Signature Dynamic Diagonal Kick (R/Q) -->
    <path d="M298 306 L388 424 H328 L256 328 Z" fill="url(#goldGrad)" opacity="0.95" />
  </g>
</svg>
